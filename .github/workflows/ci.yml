name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite synthesises its own fixtures with ffmpeg, so no media is checked in.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # No [sam] extra: the recommended pipeline is GPU-free and CI proves it stays
      # installable and runnable without torch.
      - name: Install focalcut
        run: pip install -e ".[dev]"

      - name: Assert torch is absent
        run: |
          if python -c "import torch" 2>/dev/null; then
            echo "::error::torch is installed in the GPU-free job — a core dependency has leaked"
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v
