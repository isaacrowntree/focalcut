[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focalcut"
version = "0.1.0"
description = "Split video into per-subject segments by following whoever the camera is focused on, and export an editor timeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac Rowntree" }]
keywords = ["video", "editing", "segmentation", "sam3", "tracking", "object-permanence"]
# The recommended pipeline (contact sheets + a vision judge) is GPU-free and needs
# only numpy + ffmpeg on PATH. torch and SAM 3 are an opt-in extra so a plain install
# does not pull ~2.5GB of CUDA wheels for users who never touch the SAM engines.
dependencies = [
    "numpy>=1.24",
    "opentimelineio>=0.17",
    "opentimelineio-plugins>=0.17",
]

[project.optional-dependencies]
# SAM 3 engines for `focalcut cut` (gated model; a CUDA GPU is recommended)
sam = [
    "torch>=2.4",
    "transformers>=5.3",
    "accelerate>=0.30",
]
# recap reels and effect modules (`focalcut reel`, `focalcut fx`); the subject pass and SAM 3 effects need a CUDA
# GPU. timm / einops / kornia / torchvision are what BiRefNet's remote code (the saliency model) imports.
reel = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=5.3",
    "accelerate>=0.30",
    "timm>=1.0",
    "einops>=0.7",
    "kornia>=0.7",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python>=4.8",
    "pillow>=10",
    "scipy>=1.10",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/isaacrowntree/focalcut"
Repository = "https://github.com/isaacrowntree/focalcut"

[project.scripts]
focalcut = "focalcut.cli:main"

[tool.setuptools.packages.find]
include = ["focalcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # long lines are caught by the formatter, not worth failing CI over
    "SIM105",   # contextlib.suppress is not clearer than a two-line try/except here
    "RUF001",   # the docs and log strings intentionally use typographic punctuation
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# ffmpeg wrappers deliberately swallow per-clip failures so one bad file cannot
# abort a batch; the error is reported in the job record instead.
"focalcut/export.py" = ["S603", "S607"]
"tests/*" = ["B011", "E702", "SIM115"]
# the reel / fx modules are dense numeric code ported from a working pipeline: short statements share lines and
# zips are over arrays built to the same length
"focalcut/reel/*" = ["E702", "B905", "SIM115", "RUF046", "RUF007", "E731", "E741", "RUF005", "RUF059", "E401"]
"focalcut/fx/*" = ["E702", "B905", "SIM115", "RUF046", "RUF007", "E731", "E741", "RUF005", "RUF059", "E401", "F401"]

# Note: requires ffmpeg/ffprobe on PATH, and a SAM 3 checkpoint you have access to
# (facebook/sam3 is a gated model — accept its license on Hugging Face and log in).
